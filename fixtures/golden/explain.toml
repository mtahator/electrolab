# Golden Explain set (P0.C.2): selections in the fixture papers with what a right answer holds.
# Run by engines/understanding/facade/tests/golden.rs (ignored: it needs the real models).
#
# kind    span, paragraph, figure, table, equation, or ask (a question about a table)
# at      the selected words, or the printed label, number or id of the object
# expect  each must be in the answer, whatever the case and punctuation; "a|b" is one or the other
#
# Spans are abbreviations selected away from the page that defines them; the expected words are the
# paper's own long form. The rest is written by hand from the papers.

# Least share of each kind that must be right. Measured (Qwen3-4B-Instruct-2507 Q4_K_M, 2026-11-25):
# every case, 3 to 6 seconds each; the rest is room for another model or another run.
[least]
span = 0.95
figure = 0.9
table = 0.9
equation = 0.9
ask = 0.9

