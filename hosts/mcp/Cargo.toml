[package]
name = "ep-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Read-only MCP server over the command registry (stdio)"

[[bin]]
name = "ep-mcp"
path = "src/main.rs"

[dependencies]
ep-bus = { path = "../../foundation/bus" }
ep-config = { path = "../../foundation/config" }
ep-os = { path = "../../foundation/os" }
ep-policy = { path = "../../foundation/policy" }
ep-types = { path = "../../foundation/types" }
ep-workspace = { path = "../../engines/workspace/facade" }
ep-document = { path = "../../engines/document/facade" }
anyhow.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }

[target.'cfg(windows)'.dependencies]
ep-os-windows = { path = "../../foundation/os-windows" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
