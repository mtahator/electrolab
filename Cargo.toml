[workspace]
resolver = "3"
# Crates are added when first needed (plans/technical-structure.md §2).
members = [
    "xtask",
    "foundation/types",
    "foundation/blob",
    "foundation/store",
    "foundation/events",
    "foundation/policy",
    "foundation/config",
    "foundation/telemetry",
    "foundation/bus",
    "foundation/os",
    "foundation/os-windows",
    "hosts/cli",
    "hosts/mcp",
    "hosts/reader/src-tauri",
    "engines/document/contract",
    "engines/document/core",
    "engines/document/adapters/lopdf",
    "engines/document/adapters/pdfium",
    "engines/document/facade",
    "engines/workspace/contract",
    "engines/workspace/core",
    "engines/workspace/facade",
]

[workspace.package]
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

# One version of every dependency, used with `dep.workspace = true`.
[workspace.dependencies]
anyhow = "1"
cargo_metadata = "0.19"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-normalization = "0.1.26"
sha2 = "0.10"
toml = "0.8"
# Milestone 1 (versions ≥ 2 weeks old on 2026-11-13)
schemars = { version = "1.2.3", features = ["uuid1"] }
blake3 = "1.8.7"
hex = "0.4.3"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4", "v7", "serde"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "process"] }
tokio-util = "0.7.20"
futures = "0.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
parking_lot = "0.13.0"
directories = "6.0.0"
dunce = "1.0.5"
windows-sys = "=0.61.2"
lopdf = { version = "=0.46.0", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
# tests
tempfile = "3.27.0"
proptest = "1.12.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stderr = "allow"

[profile.dev]
debug = "line-tables-only"

# Dependencies are compiled with some optimisation even in dev builds:
# PDF and model code is unusably slow at opt-level 0.
[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
