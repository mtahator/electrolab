[package]
name = "s7-ipc"
version = "0.0.0"
edition = "2024"
publish = false
description = "Spike P0.S7: the bus over local IPC (named pipes) between processes. Throw-away code."

[workspace]

[dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
lto = "thin"
