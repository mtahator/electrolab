# cargo-deny: licences, advisories, banned crates (§18.4, §26 "Licences").

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Unmaintained (not a vulnerability). Reaches us only through Tauri's Linux menu stack
    # (muda -> gtk -> glib-macros), which is not built for Windows. Revisit at the port stage.
    { id = "RUSTSEC-2024-0370", reason = "Linux-only transitive dependency of Tauri; review at the port stage" },
]

[licenses]
version = 2
# Anything not listed is rejected: GPL, AGPL and LGPL never enter by accident.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
]
confidence-threshold = 0.9
# The allow list is a policy, not a census: unused entries are fine.
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # AGPL PDF libraries (§21 licence note)
    { name = "mupdf" },
    { name = "mupdf-sys" },
    # TLS: rustls only, one stack everywhere
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
