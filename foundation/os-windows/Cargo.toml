[package]
name = "ep-os-windows"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Windows adapters of every ep-os port (boundary crate: the only place with Win32 calls)"

[target.'cfg(windows)'.dependencies]
ep-os = { path = "../os" }
directories.workspace = true
tokio.workspace = true
futures.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Performance", "Win32_System_Power", "Win32_Security", "Win32_Security_Credentials", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
ep-bus = { path = "../bus" }
tempfile.workspace = true
tokio.workspace = true

# Boundary crate: `unsafe` is denied (not forbidden) so that each Win32 call can be allowed
# one item at a time, with a SAFETY comment. Everything else matches the workspace lints.
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
