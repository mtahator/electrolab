# Pipeline of plans/technical-structure.md §10 (T1: Windows full, Linux and macOS check only).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    name: windows (full)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-machete
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # The Reader host embeds the built UI, so the UI is built before any Rust check.
      - name: ui install
        run: pnpm install --frozen-lockfile
      - name: ui typecheck
        run: pnpm -r typecheck
      - name: ui tests (helpers, theme contrast)
        run: pnpm -r test
      - name: ui tokens only
        run: pnpm -r lint
      - name: ui build
        run: pnpm --filter @electropaper/reader-ui build
      # PDFium for the Document engine tests and the installer (llama.cpp is not needed here).
      - name: natives (PDFium)
        run: cargo xtask fetch-natives pdfium
      - name: format
        run: cargo fmt --all --check
      - name: lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: architecture
        run: cargo xtask arch-check
      - name: schemas and bindings
        run: cargo xtask schema-check
      - name: licences and advisories
        run: cargo deny check
      - name: unused dependencies
        run: cargo machete
      - name: tests
        run: cargo nextest run --workspace --no-tests=warn
      - name: installer (NSIS, unsigned)
        run: pnpm --filter @electropaper/reader-host bundle
      - uses: actions/upload-artifact@v4
        with:
          name: reader-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  portability:
    name: ${{ matrix.os }} (compile + core tests)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # The Reader host is Windows-only until the port stage (ADR-002); everything else must compile.
      - name: compile
        run: cargo check --workspace --all-targets --exclude ep-reader
      - name: tests (contracts, cores, tooling)
        run: cargo test --package xtask --package ep-types --package ep-policy --package ep-document-contract --package ep-document-core --package ep-workspace-contract --package ep-workspace-core
